<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <g id="pine" fill="#1f4d38">
      <polygon points="0,-92 22,-48 -22,-48"/>
      <polygon points="0,-68 28,-18 -28,-18"/>
      <polygon points="0,-42 34,18 -34,18"/>
      <rect x="-4" y="18" width="8" height="16"/>
    </g>
    <g id="cloud" fill="#fff">
      <ellipse cx="0" cy="0" rx="120" ry="30"/>
      <ellipse cx="-70" cy="10" rx="80" ry="24"/>
      <ellipse cx="80" cy="12" rx="90" ry="24"/>
      <ellipse cx="10" cy="-18" rx="70" ry="26"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="#6fa0c4"/>
  <rect y="300" width="1600" height="300" fill="#8db5cf" opacity="0.6"/>

  <!-- Clouds -->
  <use href="#cloud" x="260" y="120" opacity="0.9"/>
  <use href="#cloud" x="760" y="70" opacity="0.8" transform="translate(0 0) scale(1.1)"/>
  <use href="#cloud" x="1250" y="170" opacity="0.9"/>
  <use href="#cloud" x="520" y="290" opacity="0.7" transform="scale(0.9)"/>
  <use href="#cloud" x="1450" y="330" opacity="0.75" transform="scale(0.8)"/>

  <!-- Far mountains -->
  <path d="M0 520 L120 430 L240 500 L380 380 L520 480 L680 360 L820 470 L980 340 L1140 460 L1300 380 L1460 470 L1600 400 L1600 900 L0 900 Z" fill="#8fb1c4"/>
  <!-- Snow caps -->
  <g fill="#f4f8fa" opacity="0.9">
    <polygon points="380,380 350,420 372,412 392,428 410,414"/>
    <polygon points="680,360 650,402 672,394 694,410 714,396"/>
    <polygon points="980,340 948,384 972,376 996,392 1016,378"/>
    <polygon points="1300,380 1272,418 1294,410 1314,424 1332,412"/>
  </g>

  <!-- Mid mountains -->
  <path d="M0 610 L160 520 L300 590 L470 480 L640 580 L800 510 L980 610 L1160 500 L1340 600 L1480 530 L1600 590 L1600 900 L0 900 Z" fill="#5e8f86"/>

  <!-- Low fog -->
  <g fill="#fff" opacity="0.55">
    <ellipse cx="300" cy="610" rx="320" ry="34"/>
    <ellipse cx="900" cy="640" rx="380" ry="30"/>
    <ellipse cx="1400" cy="615" rx="300" ry="34"/>
  </g>

  <!-- Near hills -->
  <path d="M0 720 C200 640 400 680 600 660 S1000 630 1200 668 S1500 680 1600 650 L1600 900 L0 900 Z" fill="#3c7a55"/>

  <!-- Pines -->
  <use href="#pine" transform="translate(70 700) scale(1.1)"/>
  <use href="#pine" transform="translate(150 712) scale(0.9)"/>
  <use href="#pine" transform="translate(1060 668) scale(0.8)"/>
  <use href="#pine" transform="translate(1130 676) scale(1)"/>
  <use href="#pine" transform="translate(1520 672) scale(1.15)"/>
  <use href="#pine" transform="translate(1440 684) scale(0.85)"/>

  <!-- Foreground meadow -->
  <path d="M0 810 C300 750 600 800 900 770 S1400 750 1600 780 L1600 900 L0 900 Z" fill="#2a6445"/>

  <!-- Chorten -->
  <g>
    <rect x="150" y="772" width="124" height="62" fill="#ede7da"/>
    <rect x="150" y="792" width="124" height="14" fill="#b5412f"/>
    <rect x="162" y="754" width="100" height="20" fill="#f4f0e6"/>
    <path d="M172 754 Q212 696 252 754 Z" fill="#f4f0e6"/>
    <rect x="194" y="716" width="36" height="14" fill="#f4f0e6"/>
    <polygon points="198,716 226,716 212,648" fill="#d8a93b"/>
    <circle cx="212" cy="642" r="8" fill="#d8a93b"/>
  </g>

  <!-- Prayer flags -->
  <g transform="rotate(10.2 -20 120)">
    <line x1="-20" y1="120" x2="800" y2="120" stroke="#2f2f2f" stroke-width="2"/>
    <g>
      <rect x="0" y="122" width="28" height="24" fill="#2f6fb5"/>
      <rect x="40" y="122" width="28" height="24" fill="#f4f4f0"/>
      <rect x="80" y="122" width="28" height="24" fill="#d9453d"/>
      <rect x="120" y="122" width="28" height="24" fill="#2e8b57"/>
      <rect x="160" y="122" width="28" height="24" fill="#e8b531"/>
      <rect x="200" y="122" width="28" height="24" fill="#2f6fb5"/>
      <rect x="240" y="122" width="28" height="24" fill="#f4f4f0"/>
      <rect x="280" y="122" width="28" height="24" fill="#d9453d"/>
      <rect x="320" y="122" width="28" height="24" fill="#2e8b57"/>
      <rect x="360" y="122" width="28" height="24" fill="#e8b531"/>
      <rect x="400" y="122" width="28" height="24" fill="#2f6fb5"/>
      <rect x="440" y="122" width="28" height="24" fill="#f4f4f0"/>
      <rect x="480" y="122" width="28" height="24" fill="#d9453d"/>
      <rect x="520" y="122" width="28" height="24" fill="#2e8b57"/>
      <rect x="560" y="122" width="28" height="24" fill="#e8b531"/>
      <rect x="600" y="122" width="28" height="24" fill="#2f6fb5"/>
      <rect x="640" y="122" width="28" height="24" fill="#f4f4f0"/>
      <rect x="680" y="122" width="28" height="24" fill="#d9453d"/>
      <rect x="720" y="122" width="28" height="24" fill="#2e8b57"/>
      <rect x="760" y="122" width="28" height="24" fill="#e8b531"/>
    </g>
  </g>
</svg>
